<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ujian Online CBT - Portal Siswa</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    .card-login {
      max-width: 450px;
      margin: 60px auto;
    }
  </style>
</head>
<body class="bg-light">

  <!-- Navbar -->
  <nav class="navbar navbar-dark bg-primary shadow-sm">
    <div class="container">
      <span class="navbar-brand fw-bold">
        <i class="bi bi-laptop me-2"></i>CBT SMP PLUS ANNUUR - Portal Siswa
      </span>
    </div>
  </nav>

  <!-- FORM LOGIN SISWA -->
  <div id="sectionLogin" class="container">
    <div class="card card-login border-0 shadow-lg">
      <div class="card-header bg-primary text-white text-center py-3">
        <h5 class="fw-bold mb-0"><i class="bi bi-person-circle me-2"></i>Masuk Ujian</h5>
      </div>
      <div class="card-body p-4">
        <form id="formLoginSiswa" onsubmit="handleLoginSiswa(event)">
          <div class="mb-3">
            <label class="form-label fw-bold">NISN Siswa</label>
            <input type="text" id="loginNisn" class="form-control" placeholder="Masukkan NISN Anda" required>
          </div>
          <div class="mb-3">
            <label class="form-label fw-bold">Token Ujian</label>
            <input type="text" id="loginToken" class="form-control text-uppercase fw-bold" placeholder="Contoh: X7K9P" required>
          </div>
          <button type="submit" id="btnSubmitLogin" class="btn btn-primary w-100 fw-bold py-2">
            <i class="bi bi-box-arrow-in-right me-1"></i> Mulai Kerjakan Ujian
          </button>
        </form>
      </div>
    </div>
  </div>

  <!-- LEMBAR UJIAN SISWA -->
  <div id="sectionUjian" class="container my-4 d-none">
    <div class="row g-3">
      
      <!-- Panel Info & Timer -->
      <div class="col-md-4">
        <div class="card border-0 shadow-sm sticky-top" style="top: 20px;">
          <div class="card-header bg-primary text-white fw-bold">
            <i class="bi bi-person-badge me-2"></i>Data Peserta
          </div>
          <div class="card-body">
            <p class="mb-1"><strong>Nama:</strong> <span id="infoSiswaNama">-</span></p>
            <p class="mb-1"><strong>NISN:</strong> <span id="infoSiswaNisn">-</span></p>
            <p class="mb-3"><strong>Kelas:</strong> <span id="infoSiswaKelas">-</span></p>
            <hr>
            <div class="text-center bg-light p-3 rounded border">
              <span class="small text-muted d-block font-monospace">Sisa Waktu Ujian</span>
              <h3 id="timerDisplay" class="fw-bold text-danger mb-0 font-monospace">00:00</h3>
            </div>
          </div>
        </div>
      </div>

      <!-- Area Lembar Soal -->
      <div class="col-md-8">
        <div class="card border-0 shadow-sm">
          <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center">
            <h5 id="infoJudulUjian" class="fw-bold text-primary mb-0">Ujian</h5>
          </div>
          <div class="card-body p-4" id="containerLembarSoal">
            <!-- Soal-soal di-render secara dinamis via JavaScript -->
          </div>
          <div class="card-footer bg-white text-end py-3">
            <button id="btnSubmitJawaban" class="btn btn-success fw-bold px-4" onclick="submitJawabanSiswa()">
              <i class="bi bi-check-circle me-1"></i> Kirim Jawaban Saya
            </button>
          </div>
        </div>
      </div>

    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <!-- SDK Firebase Modular v9/v10 -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, getDocs, query, where, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
  apiKey: "AIzaSyBCWVQE9zWCgGJy_MYp47U4dp-gDsWFRE8",
  authDomain: "aplikasi-ujian-8e501.firebaseapp.com",
  databaseURL: "https://aplikasi-ujian-8e501-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "aplikasi-ujian-8e501",
  storageBucket: "aplikasi-ujian-8e501.firebasestorage.app",
  messagingSenderId: "945781407027",
  appId: "1:945781407027:web:4672d4c894e143c9b05246",
  measurementId: "G-CBH4C0BVXD"
};

    // Inisialisasi Firebase
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let activeSiswaData = null;
    let activeUjianData = null;
    let timerInterval = null;

    // Login Siswa dengan Ambil Data dari Firestore
    window.handleLoginSiswa = async function(e) {
      e.preventDefault();
      const btnSubmit = document.getElementById("btnSubmitLogin");
      btnSubmit.disabled = true;
      btnSubmit.innerHTML = `<span class="spinner-border spinner-border-sm me-2"></span>Memeriksa...`;

      const nisnInput = document.getElementById("loginNisn").value.trim();
      const tokenInput = document.getElementById("loginToken").value.trim().toUpperCase();

      try {
        // 1. Cek Data Siswa di Collection 'siswa'
        const qSiswa = query(collection(db, "siswa"), where("nisn", "==", nisnInput));
        const snapSiswa = await getDocs(qSiswa);

        if (snapSiswa.empty) {
          alert("NISN tidak ditemukan! Silakan hubungi Guru/Admin.");
          resetBtnLogin();
          return;
        }

        const siswaFound = { id: snapSiswa.docs[0].id, ...snapSiswa.docs[0].data() };

        // 2. Cek Data Ujian berdasarkan Token di Collection 'ujian'
        const qUjian = query(collection(db, "ujian"), where("token", "==", tokenInput));
        const snapUjian = await getDocs(qUjian);

        if (snapUjian.empty) {
          alert("Token Ujian tidak valid atau salah!");
          resetBtnLogin();
          return;
        }

        const ujianFound = { id: snapUjian.docs[0].id, ...snapUjian.docs[0].data() };

        if (!ujianFound.soal || ujianFound.soal.length === 0) {
          alert("Ujian ini belum memiliki soal.");
          resetBtnLogin();
          return;
        }

        activeSiswaData = siswaFound;
        activeUjianData = ujianFound;

        // Tampilkan Tampilan Ujian
        document.getElementById("sectionLogin").classList.add("d-none");
        document.getElementById("sectionUjian").classList.remove("d-none");

        document.getElementById("infoSiswaNama").textContent = siswaFound.nama;
        document.getElementById("infoSiswaNisn").textContent = siswaFound.nisn;
        document.getElementById("infoSiswaKelas").textContent = siswaFound.kelas;
        document.getElementById("infoJudulUjian").textContent = `${ujianFound.mapel} - ${ujianFound.judul}`;

        renderSoalUjian(ujianFound.soal);
        startTimer(parseInt(ujianFound.durasi) * 60);

      } catch (err) {
        console.error("Error Login Firebase:", err);
        alert("Gagal menghubungkan ke server Firebase. Pastikan database Firestore sudah disetup!");
        resetBtnLogin();
      }
    };

    function resetBtnLogin() {
      const btnSubmit = document.getElementById("btnSubmitLogin");
      btnSubmit.disabled = false;
      btnSubmit.innerHTML = `<i class="bi bi-box-arrow-in-right me-1"></i> Mulai Kerjakan Ujian`;
    }

    // Render Soal Ujian (3 Tipe)
    function renderSoalUjian(soalList) {
      const container = document.getElementById("containerLembarSoal");
      container.innerHTML = "";

      soalList.forEach((soal, i) => {
        const itemDiv = document.createElement("div");
        itemDiv.className = "mb-4 p-3 border rounded bg-light";

        let htmlHeader = `<h6 class="fw-bold mb-3">${i + 1}. ${soal.pertanyaan}</h6>`;
        let htmlContent = "";

        if (soal.tipe === "pg") {
          htmlContent = `
            <div class="form-check mb-2">
              <input class="form-check-input" type="radio" name="jawaban_${i}" value="A" id="q_${i}_A">
              <label class="form-check-label" for="q_${i}_A">A. ${soal.opsi.A}</label>
            </div>
            <div class="form-check mb-2">
              <input class="form-check-input" type="radio" name="jawaban_${i}" value="B" id="q_${i}_B">
              <label class="form-check-label" for="q_${i}_B">B. ${soal.opsi.B}</label>
            </div>
            <div class="form-check mb-2">
              <input class="form-check-input" type="radio" name="jawaban_${i}" value="C" id="q_${i}_C">
              <label class="form-check-label" for="q_${i}_C">C. ${soal.opsi.C}</label>
            </div>
            <div class="form-check mb-2">
              <input class="form-check-input" type="radio" name="jawaban_${i}" value="D" id="q_${i}_D">
              <label class="form-check-label" for="q_${i}_D">D. ${soal.opsi.D}</label>
            </div>
          `;
        } else if (soal.tipe === "pg_kompleks") {
          htmlContent = `
            <p class="small text-success fw-bold mb-2"><i class="bi bi-info-circle"></i> Pilih satu atau lebih jawaban yang benar:</p>
            <div class="form-check mb-2">
              <input class="form-check-input" type="checkbox" name="jawaban_${i}" value="A" id="q_${i}_A">
              <label class="form-check-label" for="q_${i}_A">A. ${soal.opsi.A}</label>
            </div>
            <div class="form-check mb-2">
              <input class="form-check-input" type="checkbox" name="jawaban_${i}" value="B" id="q_${i}_B">
              <label class="form-check-label" for="q_${i}_B">B. ${soal.opsi.B}</label>
            </div>
            <div class="form-check mb-2">
              <input class="form-check-input" type="checkbox" name="jawaban_${i}" value="C" id="q_${i}_C">
              <label class="form-check-label" for="q_${i}_C">C. ${soal.opsi.C}</label>
            </div>
            <div class="form-check mb-2">
              <input class="form-check-input" type="checkbox" name="jawaban_${i}" value="D" id="q_${i}_D">
              <label class="form-check-label" for="q_${i}_D">D. ${soal.opsi.D}</label>
            </div>
          `;
        } else if (soal.tipe === "mencocokkan") {
          let optionsKanan = soal.pasangan.map(p => p.kanan).sort(() => Math.random() - 0.5);
          htmlContent = '<p class="small text-primary fw-bold mb-2">Jodohkan kolom kiri dengan opsi kanan yang sesuai:</p>';
          
          soal.pasangan.forEach((p, indexP) => {
            let selectOptions = optionsKanan.map(opt => `<option value="${opt}">${opt}</option>`).join("");
            htmlContent += `
              <div class="row g-2 align-items-center mb-2">
                <div class="col-6 fw-bold small">${p.kiri}</div>
                <div class="col-6">
                  <select class="form-select form-select-sm" name="match_${i}_${indexP}">
                    <option value="">-- Pilih Pasangan --</option>
                    ${selectOptions}
                  </select>
                </div>
              </div>
            `;
          });
        }

        itemDiv.innerHTML = htmlHeader + htmlContent;
        container.appendChild(itemDiv);
      });
    }

    // Timer Ujian
    function startTimer(durationInSeconds) {
      let timer = durationInSeconds;
      const display = document.getElementById("timerDisplay");

      timerInterval = setInterval(() => {
        let minutes = parseInt(timer / 60, 10);
        let seconds = parseInt(timer % 60, 10);

        minutes = minutes < 10 ? "0" + minutes : minutes;
        seconds = seconds < 10 ? "0" + seconds : seconds;

        display.textContent = `${minutes}:${seconds}`;

        if (--timer < 0) {
          clearInterval(timerInterval);
          alert("Waktu ujian telah habis! Jawaban Anda akan dikirim otomatis.");
          submitJawabanSiswa();
        }
      }, 1000);
    }

    // Penilaian & Simpan Hasil ke Firestore Collection 'hasil'
    window.submitJawabanSiswa = async function() {
      if (!confirm("Apakah Anda yakin ingin menyelesaikan ujian ini?")) return;

      const btnSubmit = document.getElementById("btnSubmitJawaban");
      btnSubmit.disabled = true;
      btnSubmit.innerHTML = `<span class="spinner-border spinner-border-sm me-2"></span>Mengirim...`;

      clearInterval(timerInterval);

      const soalList = activeUjianData.soal;
      let totalPoin = 0;
      let poinMaksimal = soalList.length;

      soalList.forEach((soal, i) => {
        if (soal.tipe === "pg") {
          const checked = document.querySelector(`input[name="jawaban_${i}"]:checked`);
          if (checked && checked.value === soal.kunci) {
            totalPoin += 1;
          }
        } else if (soal.tipe === "pg_kompleks") {
          const checkedArr = Array.from(document.querySelectorAll(`input[name="jawaban_${i}"]:checked`)).map(c => c.value);
          const kunciArr = soal.kunci || [];
          if (JSON.stringify(checkedArr.sort()) === JSON.stringify(kunciArr.sort())) {
            totalPoin += 1;
          }
        } else if (soal.tipe === "mencocokkan") {
          let matchBenar = true;
          soal.pasangan.forEach((p, indexP) => {
            const selectEl = document.querySelector(`select[name="match_${i}_${indexP}"]`);
            if (!selectEl || selectEl.value !== p.kanan) {
              matchBenar = false;
            }
          });
          if (matchBenar) totalPoin += 1;
        }
      });

      const nilaiAkhir = Math.round((totalPoin / poinMaksimal) * 100);

      try {
        // Kirim hasil ke Firestore
        await addDoc(collection(db, "hasil"), {
          ujianId: activeUjianData.id,
          nisn: activeSiswaData.nisn,
          nama: activeSiswaData.nama,
          kelas: activeSiswaData.kelas,
          mapel: activeUjianData.mapel,
          judul: activeUjianData.judul,
          nilai: nilaiAkhir,
          waktuSelesai: new Date().toLocaleString("id-ID")
        });

        alert(`Ujian Selesai!\n\nNama: ${activeSiswaData.nama}\nNilai Anda: ${nilaiAkhir}`);
        window.location.reload();

      } catch (err) {
        console.error("Error Simpan Hasil Firestore:", err);
        alert("Gagal mengirim hasil ke server. Silakan coba klik Kirim Jawaban lagi.");
        btnSubmit.disabled = false;
        btnSubmit.innerHTML = `<i class="bi bi-check-circle me-1"></i> Kirim Jawaban Saya`;
      }
    };
  </script>

</body>
</html>
