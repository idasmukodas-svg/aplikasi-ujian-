<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ujian Online CBT - Portal Siswa</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body {
      user-select: none; /* Mencegah foto/copy-paste teks soal */
      -webkit-user-select: none;
    }
    .sticky-timer {
      position: sticky;
      top: 0;
      z-index: 1020;
    }
    .soal-card {
      border-left: 4px solid #0d6efd;
    }
    .warning-overlay {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(220, 53, 69, 0.95);
      color: white;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
  </style>
</head>
<body class="bg-light">

  <!-- OVERLAY PERINGATAN KELUAR FULLSCREEN / KELUAR TAB -->
  <div id="warningOverlay" class="warning-overlay d-none">
    <i class="bi bi-exclamation-triangle-fill display-1 mb-3"></i>
    <h2 class="fw-bold">PERINGATAN KECURANGAN!</h2>
    <p class="fs-5 text-center px-3" id="warningText">Anda terdeteksi keluar dari layar penuh / berpindah tab!</p>
    <p class="fw-bold fs-4">Sisa Kesempatan: <span id="warningCount" class="badge bg-warning text-dark">3</span></p>
    <button class="btn btn-light btn-lg fw-bold mt-3" onclick="kembaliKeFullscreen()">
      <i class="bi bi-fullscreen me-2"></i>Kembali Ke Ujian (Layar Penuh)
    </button>
  </div>

  <!-- NAVBAR -->
  <nav class="navbar navbar-dark bg-primary shadow-sm">
    <div class="container">
      <a class="navbar-brand fw-bold" href="#">
        <i class="bi bi-mortarboard-fill me-2"></i>CBT SMP PLUS ANNUUR - PORTAL SISWA
      </a>
      <span id="siswaNavInfo" class="navbar-text text-white fw-bold"></span>
    </div>
  </nav>

  <!-- 1. HALAMAN LOGIN / MASUK UJIAN -->
  <div class="container my-5" id="sectionLogin">
    <div class="row justify-content-center">
      <div class="col-md-5">
        <div class="card border-0 shadow-lg">
          <div class="card-header bg-primary text-white text-center py-3">
            <h5 class="fw-bold mb-0"><i class="bi bi-person-check me-2"></i>Masuk Ujian</h5>
          </div>
          <div class="card-body p-4">
            <form id="formLoginSiswa">
              <div class="mb-3">
                <label class="form-label fw-bold">NISN Siswa</label>
                <input type="text" id="inputNisn" class="form-control form-control-lg" placeholder="Masukkan NISN Anda" required>
              </div>
              <div class="mb-3">
                <label class="form-label fw-bold">Token Ujian</label>
                <input type="text" id="inputToken" class="form-control form-control-lg text-uppercase fw-bold" placeholder="Contoh: X7Y2Z" required>
              </div>
              <div class="alert alert-info small mb-3">
                <i class="bi bi-shield-lock-fill me-1"></i> Ujian menggunakan mode <strong>Layar Penuh (Fullscreen)</strong>. Dilarang berpindah tab atau keluar dari browser selama pengerjaan.
              </div>
              <button type="submit" class="btn btn-primary btn-lg w-100 fw-bold">
                <i class="bi bi-box-arrow-in-right me-2"></i>Mulai Ujian
              </button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- 2. HALAMAN PENGERJAAN SOAL -->
  <div class="container my-4 d-none" id="sectionUjian">
    
    <!-- Timer & Info Ujian Header -->
    <div class="card border-0 shadow-sm bg-dark text-white mb-4 sticky-timer">
      <div class="card-body d-flex justify-content-between align-items-center py-2 px-3">
        <div>
          <h6 id="infoJudulUjian" class="fw-bold mb-0 text-warning">--</h6>
          <small id="infoNamaSiswa" class="text-white-50">--</small>
        </div>
        <div class="text-end">
          <span class="small text-white-50 d-block">Sisa Waktu</span>
          <span id="timerCountdown" class="fs-4 fw-bold font-monospace text-success">00:00:00</span>
        </div>
      </div>
    </div>

    <!-- Container Daftar Soal -->
    <div id="containerSoalList" class="mb-4"></div>

    <!-- Tombol Selesai Ujian -->
    <div class="card border-0 shadow-sm mb-5">
      <div class="card-body text-end bg-white">
        <button class="btn btn-success btn-lg fw-bold px-5" onclick="konfirmasiSelesaiUjian()">
          <i class="bi bi-check-circle-fill me-2"></i>Kumpulkan Jawaban
        </button>
      </div>
    </div>

  </div>

  <!-- External Libraries -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Firebase Logic (Module) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, get, set, child } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBCWVQE9zWCgGJy_MYp47U4dp-gDsWFRE8",
      authDomain: "aplikasi-ujian-8e501.firebaseapp.com",
      databaseURL: "https://aplikasi-ujian-8e501-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "aplikasi-ujian-8e501",
      storageBucket: "aplikasi-ujian-8e501.firebasestorage.app",
      messagingSenderId: "945781407027",
      appId: "1:945781407027:web:4672d4c894e143c9b05246",
      measurementId: "G-CBH4C0BVXD"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    let siswaAktif = null;
    let ujianAktif = null;
    let timerInterval = null;
    let sisaDetik = 0;
    let warningTotal = 3;
    let isExamActive = false;

    // --- HELPER ACAK ARRAY (Fisher-Yates Shuffle) ---
    function shuffleArray(array) {
      const arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    // --- FORM LOGIN SUBMIT ---
    document.getElementById("formLoginSiswa").addEventListener("submit", async (e) => {
      e.preventDefault();
      const nisnInput = document.getElementById("inputNisn").value.trim();
      const tokenInput = document.getElementById("inputToken").value.trim().toUpperCase();

      try {
        const dbRef = ref(db);
        
        // 1. Ambil & Cek Siswa
        const snapSiswa = await get(child(dbRef, "daftarSiswa"));
        if (!snapSiswa.exists()) {
          alert("Belum ada data siswa terdaftar!");
          return;
        }

        const dataSiswa = snapSiswa.val();
        let foundSiswa = Object.values(dataSiswa).find(s => String(s.nisn).trim() === nisnInput);

        if (!foundSiswa) {
          alert("NISN tidak ditemukan! Silakan hubungi Guru/Admin.");
          return;
        }

        // 2. Ambil & Cek Ujian Token
        const snapUjian = await get(child(dbRef, "daftarUjian"));
        if (!snapUjian.exists()) {
          alert("Belum ada jadwal ujian aktif!");
          return;
        }

        const dataUjian = snapUjian.val();
        let foundUjian = Object.values(dataUjian).find(u => String(u.token).trim().toUpperCase() === tokenInput);

        if (!foundUjian) {
          alert("Token Ujian tidak valid atau salah!");
          return;
        }

        if (!foundUjian.soal || foundUjian.soal.length === 0) {
          alert("Ujian ini belum memiliki soal!");
          return;
        }

        siswaAktif = foundSiswa;
        ujianAktif = foundUjian;

        // Minta Layar Penuh
        mulaiUjianFull();

      } catch (err) {
        console.error("Login Error:", err);
        alert("Gagal memproses login: " + err.message);
      }
    });

    // --- MASUK KONTEN UJIAN & FULLSCREEN ---
    function mulaiUjianFull() {
      const docEl = document.documentElement;
      if (docEl.requestFullscreen) {
        docEl.requestFullscreen().catch(err => console.log(err));
      } else if (docEl.webkitRequestFullscreen) {
        docEl.webkitRequestFullscreen();
      }

      document.getElementById("sectionLogin").classList.add("d-none");
      document.getElementById("sectionUjian").classList.remove("d-none");

      document.getElementById("siswaNavInfo").innerText = `${siswaAktif.nama} (${siswaAktif.kelas})`;
      document.getElementById("infoJudulUjian").innerText = `${ujianAktif.mapel} - ${ujianAktif.judul}`;
      document.getElementById("infoNamaSiswa").innerText = `Siswa: ${siswaAktif.nama} | NISN: ${siswaAktif.nisn}`;

      renderSoalSiswa(ujianAktif.soal);

      sisaDetik = parseInt(ujianAktif.durasi || 60) * 60;
      startTimer();

      isExamActive = true;
      pasangSistemKeamanan();
    }

    // --- RENDER SOAL (ACAK SOAL, OPSI, & GAMBAR) ---
    function renderSoalSiswa(originalListSoal) {
      const container = document.getElementById("containerSoalList");
      container.innerHTML = "";

      // 1. ACAK URUTAN SOAL
      const listSoal = shuffleArray(originalListSoal);

      listSoal.forEach((s, idx) => {
        const card = document.createElement("div");
        card.className = "card border-0 shadow-sm mb-4 soal-card";

        // Tampilkan Gambar jika ada
        let htmlGambar = s.gambarUrl ? `
          <div class="mb-3 text-center">
            <img src="${s.gambarUrl}" class="img-fluid rounded border shadow-sm" style="max-height: 300px;" alt="Gambar Soal">
          </div>
        ` : "";

        let htmlOption = "";

        if (s.tipe === "pg" || s.tipe === "pg_kompleks") {
          // 2. ACAK URUTAN OPSI JAWABAN (A, B, C, D)
          const keysOpsi = Object.keys(s.opsi || {}).filter(k => s.opsi[k]);
          const keysShuffled = shuffleArray(keysOpsi);

          htmlOption = `
            <div class="mt-3">
              ${s.tipe === "pg_kompleks" ? '<p class="small text-primary fw-bold mb-2"><i class="bi bi-info-circle me-1"></i>Pilih satu atau lebih jawaban benar:</p>' : ''}
              ${keysShuffled.map(opt => `
                <div class="form-check mb-2">
                  <input class="form-check-input" type="${s.tipe === 'pg' ? 'radio' : 'checkbox'}" name="soal_${s.id}" id="opt_${s.id}_${opt}" value="${opt}">
                  <label class="form-check-label fs-6" for="opt_${s.id}_${opt}">
                    ${s.opsi[opt]}
                  </label>
                </div>
              `).join('')}
            </div>
          `;
        } else if (s.tipe === "mencocokkan" && s.pasangan) {
          // 3. ACAK PILIHAN KANAN
          const listKananShuffled = shuffleArray(s.pasangan.map(p => p.kanan));

          htmlOption = `
            <div class="mt-3">
              <p class="small text-primary fw-bold mb-2"><i class="bi bi-info-circle me-1"></i>Jodohkan pernyataan di kiri dengan pasangan di kanan:</p>
              ${s.pasangan.map((p, pIdx) => `
                <div class="row align-items-center g-2 mb-3 bg-light p-2 rounded">
                  <div class="col-md-6 fw-bold">${pIdx + 1}. ${p.kiri}</div>
                  <div class="col-md-6">
                    <select class="form-select match-select" data-soal-id="${s.id}" data-kiri="${p.kiri}">
                      <option value="">-- Pilih Pasangan --</option>
                      ${listKananShuffled.map(k => `<option value="${k}">${k}</option>`).join('')}
                    </select>
                  </div>
                </div>
              `).join('')}
            </div>
          `;
        }

        card.innerHTML = `
          <div class="card-body p-4">
            <h5 class="fw-bold text-dark mb-3">Soal No. ${idx + 1}</h5>
            ${htmlGambar}
            <div class="fs-5 mb-3">${s.pertanyaan}</div>
            ${htmlOption}
          </div>
        `;
        container.appendChild(card);
      });
    }

    // --- TIMER COUNTDOWN ---
    function startTimer() {
      timerInterval = setInterval(() => {
        sisaDetik--;
        if (sisaDetik <= 0) {
          clearInterval(timerInterval);
          alert("Waktu ujian telah habis! Sistem akan otomatis mengumpulkan jawaban Anda.");
          prosesKumpulJawaban();
        } else {
          const jam = Math.floor(sisaDetik / 3600);
          const menit = Math.floor((sisaDetik % 3600) / 60);
          const detik = sisaDetik % 60;
          document.getElementById("timerCountdown").innerText = 
            `${String(jam).padStart(2, '0')}:${String(menit).padStart(2, '0')}:${String(detik).padStart(2, '0')}`;
        }
      }, 1000);
    }

    // --- FULLSCREEN LOCK & ANTI-CHEATING ---
    function pasangSistemKeamanan() {
      document.addEventListener("fullscreenchange", handleViolation);
      document.addEventListener("webkitfullscreenchange", handleViolation);

      window.addEventListener("blur", handleViolation);
      document.addEventListener("visibilitychange", () => {
        if (document.hidden) handleViolation();
      });
    }

    function handleViolation() {
      if (!isExamActive) return;

      const isFull = document.fullscreenElement || document.webkitFullscreenElement;
      if (!isFull || document.hidden) {
        warningTotal--;
        document.getElementById("warningCount").innerText = warningTotal;

        if (warningTotal <= 0) {
          isExamActive = false;
          document.getElementById("warningOverlay").classList.add("d-none");
          alert("Anda telah melanggar batas kesempatan keluar dari ujian! Jawaban Anda dikirim secara otomatis.");
          prosesKumpulJawaban();
        } else {
          document.getElementById("warningOverlay").classList.remove("d-none");
        }
      }
    }

    // --- SUBMIT JAWABAN & HITUNG SKOR ---
    async function prosesKumpulJawaban() {
      isExamActive = false;
      clearInterval(timerInterval);

      let skorTotal = 0;
      const listSoal = ujianAktif.soal || [];
      const totalSoal = listSoal.length;

      listSoal.forEach(s => {
        if (s.tipe === "pg") {
          const selected = document.querySelector(`input[name="soal_${s.id}"]:checked`);
          if (selected && selected.value === s.kunci) {
            skorTotal++;
          }
        } else if (s.tipe === "pg_kompleks") {
          const checkedVals = Array.from(document.querySelectorAll(`input[name="soal_${s.id}"]:checked`)).map(c => c.value);
          const kunciArr = Array.isArray(s.kunci) ? s.kunci : [s.kunci];
          
          if (checkedVals.length === kunciArr.length && checkedVals.every(v => kunciArr.includes(v))) {
            skorTotal++;
          }
        } else if (s.tipe === "mencocokkan" && s.pasangan) {
          const selects = document.querySelectorAll(`select[data-soal-id="${s.id}"]`);
          let benarCount = 0;
          selects.forEach(sel => {
            const kiriVal = sel.getAttribute("data-kiri");
            const pairFound = s.pasangan.find(p => p.kiri === kiriVal);
            if (pairFound && pairFound.kanan === sel.value) {
              benarCount++;
            }
          });
          if (benarCount === s.pasangan.length) {
            skorTotal++;
          }
        }
      });

      const nilaiAkhir = Math.round((skorTotal / totalSoal) * 100);

      const hasilRefKey = `${siswaAktif.nisn}_${ujianAktif.id}`;
      const payloadHasil = {
        nisn: siswaAktif.nisn,
        nama: siswaAktif.nama,
        kelas: siswaAktif.kelas || "-",
        ujianId: ujianAktif.id,
        mapel: ujianAktif.mapel,
        judul: ujianAktif.judul,
        nilai: nilaiAkhir,
        waktuSelesai: new Date().toLocaleString("id-ID")
      };

      try {
        await set(ref(db, "hasilUjian/" + hasilRefKey), payloadHasil);
        alert(`Ujian Selesai! Nilai Anda: ${nilaiAkhir}`);
      } catch (e) {
        console.error("Gagal simpan nilai:", e);
        alert(`Ujian Selesai! Nilai Anda: ${nilaiAkhir} (Catatan: Gagal mengirim rekap ke server).`);
      }

      if (document.exitFullscreen) {
        document.exitFullscreen().catch(e => console.log(e));
      }
      window.location.reload();
    }

    // --- EKSPOR FUNGSI KE SCOPE GLOBAL (WINDOW) ---
    window.kembaliKeFullscreen = function() {
      const docEl = document.documentElement;
      if (docEl.requestFullscreen) {
        docEl.requestFullscreen().catch(err => console.log(err));
      } else if (docEl.webkitRequestFullscreen) {
        docEl.webkitRequestFullscreen();
      }
      document.getElementById("warningOverlay").classList.add("d-none");
    };

    window.konfirmasiSelesaiUjian = function() {
      if (confirm("Apakah Anda yakin ingin mengumpulkan jawaban ujian ini?")) {
        prosesKumpulJawaban();
      }
    };
  </script>
</body>
</html>
